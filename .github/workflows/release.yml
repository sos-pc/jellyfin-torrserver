name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet test tests/TorrServer.Tests.csproj -c Release
      - run: dotnet build Jellyfin.Plugin.TorrServer/Jellyfin.Plugin.TorrServer.csproj -c Release -f net10.0 -p:Version="${GITHUB_REF_NAME#v}"
      - run: python3 scripts/package.py "${GITHUB_REF_NAME#v}"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
