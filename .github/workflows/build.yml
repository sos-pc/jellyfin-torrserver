name: Build and test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: dotnet test tests/TorrServer.Tests.csproj -c Release
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: TorrServer-plugin
          path: |
            dist/
            manifest.json
